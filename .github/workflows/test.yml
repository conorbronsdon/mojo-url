name: test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Install Mojo nightly
        run: |
          uv venv
          uv pip install mojo \
            --index https://whl.modular.com/nightly/simple/ \
            --prerelease allow
          .venv/bin/mojo --version

      - name: Regenerate fixtures (must match committed)
        run: |
          python3 test/data/gen_fixtures.py > test/data/fixtures.txt
          git diff --exit-code test/data/fixtures.txt

      - name: Tests
        run: .venv/bin/mojo run -I src test/test_url.mojo
